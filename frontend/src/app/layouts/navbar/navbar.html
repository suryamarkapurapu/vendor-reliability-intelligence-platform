<mat-toolbar color="primary">

    <!-- Platform name -->
    <app-vr-brand></app-vr-brand>

    <!-- Push everything else to the right -->
    <span class="spacer"></span>


    <!-- Notification -->
    <button
        mat-icon-button
        class="notification-button"
        [matMenuTriggerFor]="notificationMenu"
        aria-label="Notifications">

        <mat-icon>
            notifications
        </mat-icon>

        <span
            class="notification-badge"
            *ngIf="unreadCount > 0">

            {{ unreadCount }}

        </span>

    </button>


    <!-- Notification menu -->
    <mat-menu #notificationMenu="matMenu">

        <div class="notification-container">

            <div class="notification-header">

                <h3>
                    Notifications
                </h3>

                <span>
                    {{ unreadCount }} unread
                </span>

            </div>


            <!-- No notifications -->
            <div
                class="no-notifications"
                *ngIf="notifications.length === 0">

                No notifications
            </div>


            <!-- Notifications -->
            <div
                class="notification-item"
                *ngFor="let notification of notifications"
                [class.unread]="!notification.is_read"
                (click)="markAsRead(notification)">

                <mat-icon class="notification-icon">
                    notifications
                </mat-icon>

                <div class="notification-content">

                    <strong>
                        {{ notification.title }}
                    </strong>

                    <p>
                        {{ notification.message }}
                    </p>

                    <small>
                        {{ notification.created_at | date:'medium' }}
                    </small>

                </div>

                <span
                    class="unread-dot"
                    *ngIf="!notification.is_read">
                </span>

            </div>

        </div>

    </mat-menu>


    <!-- User information -->
    <button
        mat-button
        class="user-profile"
        [matMenuTriggerFor]="userMenu">

        <mat-icon>
            account_circle
        </mat-icon>

        <span class="user-details">

            <span class="username">
                {{ username }}
            </span>

            <span class="role">
                {{ roleName }}
            </span>

        </span>

        <mat-icon class="dropdown-icon">
            expand_more
        </mat-icon>

    </button>


    <!-- User menu -->
    <mat-menu #userMenu="matMenu">

        <div class="user-menu-header">

            <strong>
                {{ username }}
            </strong>

            <span>
                {{ roleName }}
            </span>

        </div>

    </mat-menu>

</mat-toolbar>
