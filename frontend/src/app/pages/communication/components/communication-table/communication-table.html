<div class="table-wrapper">
  @if (dataSource.length === 0) {
    <div class="empty-table-state" style="padding: 40px; text-align: center; color: #888; background: #fff; border-radius: 8px; border: 1px dashed #ccc; margin: 16px 0;">
      <mat-icon style="font-size: 48px; height: 48px; width: 48px; color: #aaa; margin-bottom: 8px;">chat</mat-icon>
      <p style="font-size: 16px; margin: 0;">No messages found</p>
    </div>
  } @else {
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z4 full-width">

      <ng-container matColumnDef="vendor">
        <th mat-header-cell *matHeaderCellDef>Vendor / Recipient</th>
        <td mat-cell *matCellDef="let row"><strong>{{row.vendor}}</strong></td>
      </ng-container>

      <ng-container matColumnDef="subject">
        <th mat-header-cell *matHeaderCellDef>Subject</th>
        <td mat-cell *matCellDef="let row">{{row.subject}}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let row">{{row.type}}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let row">{{row.date}}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip [style.text-transform]="'uppercase'">
            {{row.status}}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="attachment">
        <th mat-header-cell *matHeaderCellDef>Attachment</th>
        <td mat-cell *matCellDef="let row">{{row.attachment}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="viewCommunication(row)">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons>
    </mat-paginator>
  }
</div>
