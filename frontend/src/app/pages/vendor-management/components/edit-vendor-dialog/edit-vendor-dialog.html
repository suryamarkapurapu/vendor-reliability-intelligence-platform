<h2 mat-dialog-title>Edit Vendor</h2>

<mat-dialog-content>
<div class="form-container">
<form [formGroup]="vendorForm">

    <mat-form-field appearance="outline">
        <mat-label>Vendor Name</mat-label>
        <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
            <mat-option [value]="1">Raw Material Suppliers</mat-option>
            <mat-option [value]="2">Equipment Vendors</mat-option>
            <mat-option [value]="3">IT Vendors</mat-option>
            <mat-option [value]="4">Service Providers</mat-option>
            <mat-option [value]="5">Logistics Partners</mat-option>
            <mat-option [value]="6">Maintenance Vendors</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Contact</mat-label>
        <input matInput formControlName="contact">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Email / Address</mat-label>
        <input matInput formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
            <mat-option value="pending">Pending</mat-option>
            <mat-option value="approved">Approved</mat-option>
            <mat-option value="suspended">Suspended</mat-option>
            <mat-option value="rejected">Rejected</mat-option>
            <mat-option value="blacklisted">Blacklisted</mat-option>
        </mat-select>
    </mat-form-field>

</form>
</div>
</mat-dialog-content>

<mat-dialog-actions align="end">
<button mat-button mat-dialog-close>Cancel</button>
<button mat-raised-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
