<h2 mat-dialog-title>Edit Procurement</h2>

<mat-dialog-content>

  <!-- Request ID -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Request ID</mat-label>
    <input
      matInput
      [(ngModel)]="data.requestId"
      readonly>
  </mat-form-field>

  <!-- Item -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Item</mat-label>
    <input
      matInput
      [(ngModel)]="data.item">
  </mat-form-field>

  <!-- Vendor -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Vendor</mat-label>
    <input
      matInput
      [(ngModel)]="data.vendor">
  </mat-form-field>

  <!-- Quantity -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Quantity</mat-label>
    <input
      matInput
      type="number"
      [(ngModel)]="data.quantity">
  </mat-form-field>

  <!-- Budget -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Budget</mat-label>
    <input
      matInput
      type="number"
      [(ngModel)]="data.budget">
  </mat-form-field>

  <!-- Required Date -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Required Date</mat-label>
    <input
      matInput
      [(ngModel)]="data.requiredDate">
  </mat-form-field>

  <!-- Status -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Status</mat-label>

    <mat-select [(ngModel)]="data.status">

      <mat-option value="Approved">
        Approved
      </mat-option>

      <mat-option value="Pending">
        Pending
      </mat-option>

      <mat-option value="Rejected">
        Rejected
      </mat-option>

    </mat-select>

  </mat-form-field>

  <!-- Priority -->
  <mat-form-field appearance="outline" class="full-width">

    <mat-label>Priority</mat-label>

    <mat-select [(ngModel)]="data.priority">

      <mat-option value="High">
        High
      </mat-option>

      <mat-option value="Medium">
        Medium
      </mat-option>

      <mat-option value="Low">
        Low
      </mat-option>

    </mat-select>

  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-stroked-button
    (click)="cancel()">

    Cancel

  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="save()">

    Save

  </button>

</mat-dialog-actions>
