<mat-card class="kpi-card">

     <div class="card-content">

        <div class="text-content">

            <p class="title">{{title}}</p>

            <h2>
  @if (currency) {
    ₹{{ value | number:'1.0-0':'en-IN' }}
  } @else {
    {{ value }}
  }
</h2>

        </div>
    <mat-icon>{{icon}}</mat-icon>
</div>
</mat-card>
