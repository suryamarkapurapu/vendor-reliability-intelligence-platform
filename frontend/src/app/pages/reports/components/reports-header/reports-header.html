<div class="header">

    <div>

        <h2>Reports</h2>

        <p>
            Generate and download procurement and vendor reports.
        </p>

    </div>


    <div class="header-actions">

        <!-- Generate Report -->

        <button
            mat-raised-button
            color="primary"
            (click)="openGenerateReport()">

            <mat-icon>add</mat-icon>

            Generate Report

        </button>


        <!-- Export Reports -->

        <button
            mat-stroked-button
            color="primary"
            (click)="exportReports()">

            <mat-icon>download</mat-icon>

            Export Reports

        </button>

    </div>

</div>
