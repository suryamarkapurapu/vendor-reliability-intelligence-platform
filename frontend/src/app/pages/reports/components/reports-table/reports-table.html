<div class="table-wrapper">
  @if (dataSource.length === 0) {
    <div class="empty-table-state" style="padding: 40px; text-align: center; color: #888; background: #fff; border-radius: 8px; border: 1px dashed #ccc; margin: 16px 0;">
      <mat-icon style="font-size: 48px; height: 48px; width: 48px; color: #aaa; margin-bottom: 8px;">assessment</mat-icon>
      <p style="font-size: 16px; margin: 0;">No reports found</p>
    </div>
  } @else {
    <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="reportName">
            <th mat-header-cell *matHeaderCellDef>Report Name</th>
            <td mat-cell *matCellDef="let report"><strong>{{report.reportName}}</strong></td>
        </ng-container>

        <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef>Category</th>
            <td mat-cell *matCellDef="let report">{{report.category}}</td>
        </ng-container>

        <ng-container matColumnDef="generatedDate">
            <th mat-header-cell *matHeaderCellDef>Generated Date</th>
            <td mat-cell *matCellDef="let report">{{report.generatedDate}}</td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let report">
                <mat-chip [style.text-transform]="'uppercase'">
                    {{report.status}}
                </mat-chip>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let report">
                <button mat-icon-button [matMenuTriggerFor]="reportMenu">
                    <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #reportMenu="matMenu">
                    <button mat-menu-item (click)="viewReport(report)">
                        <mat-icon>visibility</mat-icon>
                        <span>View</span>
                    </button>
                    <button mat-menu-item (click)="downloadReport(report)">
                        <mat-icon>download</mat-icon>
                        <span>Download</span>
                    </button>
                </mat-menu>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="5"></mat-paginator>
  }
</div>
