<mat-card>
    <mat-card-header>
        <mat-card-title>
            User Preferences
        </mat-card-title>
    </mat-card-header>

    <mat-card-content style="padding-top: 16px;">
        @if (message) {
            <div style="color: #2e7d32; background: #edf7ed; padding: 10px 14px; border-radius: 4px; margin-bottom: 16px;">
                {{ message }}
            </div>
        }

        @if (error) {
            <div style="color: #d32f2f; background: #fdeded; padding: 10px 14px; border-radius: 4px; margin-bottom: 16px;">
                {{ error }}
            </div>
        }

        <form [formGroup]="preferenceForm" (ngSubmit)="saveSettings()">
            <mat-form-field appearance="outline" style="width: 100%;">
                <mat-label>Language</mat-label>
                <mat-select formControlName="language">
                    <mat-option value="English">English</mat-option>
                    <mat-option value="Hindi">Hindi</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" style="width: 100%;">
                <mat-label>Time Zone</mat-label>
                <mat-select formControlName="timezone">
                    <mat-option value="Asia/Kolkata">Asia/Kolkata</mat-option>
                    <mat-option value="UTC">UTC</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" style="width: 100%;">
                <mat-label>Currency</mat-label>
                <mat-select formControlName="currency">
                    <mat-option value="INR">INR</mat-option>
                    <mat-option value="USD">USD</mat-option>
                </mat-select>
            </mat-form-field>

            <button mat-raised-button color="primary" type="submit" [disabled]="saving || loading">
                {{ saving ? 'Saving...' : 'Save User Preferences' }}
            </button>
        </form>
    </mat-card-content>
</mat-card>
